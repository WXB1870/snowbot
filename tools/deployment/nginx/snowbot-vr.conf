# Load inside the nginx http block (Ubuntu: /etc/nginx/conf.d/).
upstream snowbot_vr_backend {
    server 127.0.0.1:8014;
}

map $http_upgrade $snowbot_vr_connection {
    default upgrade;
    ''      close;
}

server {
    listen 8012 ssl;
    ssl_certificate     /etc/nginx/tls/snowbot-vr.crt;
    ssl_certificate_key /etc/nginx/tls/snowbot-vr.key;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $snowbot_vr_connection;
    proxy_connect_timeout 2s;

    location = / {
        proxy_pass https://snowbot_vr_backend;
        proxy_intercept_errors on;
        error_page 502 503 504 = @vr_wait;
    }

    location / {
        proxy_pass https://snowbot_vr_backend;
    }

    location @vr_wait {
        if ($http_upgrade != '') { return 503; }
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
        return 200 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="3"><title>Snowbot VR</title><h1>等待机器人 VR 服务</h1><p>连接后将自动打开遥操作页面。</p></html>';
    }
}
