# ============================================================
# 机械臂 PD 控制器初始增益配置
# ============================================================
# 协议说明：
#   1. Kp 为比例增益，Kd 为微分增益
#   2. 关节顺序与实物双臂关节顺序一致
#   3. 对应 C++ 数组 Kp_lArm_low / Kd_lArm_low / Kp_rArm_low / Kd_rArm_low
# ============================================================

# ============================================================
# 低刚度 (low)
# 对应 C++ 数组 Kp_lArm_mid / Kd_lArm_mid / Kp_rArm_mid / Kd_rArm_mid
# ============================================================

left_arm_Kp_low:
  left_shoulder_pitch_joint_kp: 160
  left_shoulder_roll_joint_kp:  140
  left_shoulder_yaw_joint_kp:   100
  left_elbow_joint_kp:          100
  left_wrist_roll_joint_kp:     100
  left_wrist_pitch_joint_kp:    100
  left_wrist_yaw_joint_kp:      80

left_arm_Kd_low:
  left_shoulder_pitch_joint_kd: 50
  left_shoulder_roll_joint_kd:  40
  left_shoulder_yaw_joint_kd:   30
  left_elbow_joint_kd:          30
  left_wrist_roll_joint_kd:     30
  left_wrist_pitch_joint_kd:    30
  left_wrist_yaw_joint_kd:      30

right_arm_Kp_low:
  right_shoulder_pitch_joint_kp: 160
  right_shoulder_roll_joint_kp:  140
  right_shoulder_yaw_joint_kp:   100
  right_elbow_joint_kp:          100
  right_wrist_roll_joint_kp:     100
  right_wrist_pitch_joint_kp:    100
  right_wrist_yaw_joint_kp:      80

right_arm_Kd_low:
  right_shoulder_pitch_joint_kd: 50
  right_shoulder_roll_joint_kd:  40
  right_shoulder_yaw_joint_kd:   30
  right_elbow_joint_kd:          30
  right_wrist_roll_joint_kd:     30
  right_wrist_pitch_joint_kd:    30
  right_wrist_yaw_joint_kd:      30

