  left_shoulder_roll_joint_kd:  12
  left_shoulder_yaw_joint_kd:   12
  left_elbow_joint_kd:          12
  left_wrist_roll_joint_kd:     12
  left_wrist_pitch_joint_kd:    12
  left_wrist_yaw_joint_kd:      12

right_arm_Kp_tag:
