  left_shoulder_pitch_joint_kp: 0
  left_shoulder_roll_joint_kp:  0
  left_shoulder_yaw_joint_kp:   0
  left_elbow_joint_kp:          0
  left_wrist_roll_joint_kp:     0
  left_wrist_pitch_joint_kp:    0
  left_wrist_yaw_joint_kp:      0

left_arm_Kd_tag:
